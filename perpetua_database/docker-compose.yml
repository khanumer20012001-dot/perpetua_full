version: '3.8'

services:
  db:
    # Using pgvector image because your schema uses the vector extension for AI embeddings
    image: pgvector/pgvector:pg16
    container_name: perpetua_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # We don't need to specify POSTGRES_DB because your dump script creates 'globalmaster' and connects to it automatically
    ports:
      - "5433:5432"
    volumes:
      # Mount a local folder for persistence
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
